<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR→JP 아비트라지 — 매칭 검토</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#777; --line:#e3e3e3; --accent:#0a7cff; --ok:#0a8f3c; --no:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161718; --fg:#eee; --muted:#999; --line:#333; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, 'Noto Sans KR', sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .bar { display:flex; gap:8px; margin-bottom:16px; }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .side { display:flex; gap:10px; min-width:0; }
  .side img { width:110px; height:110px; object-fit:cover; border-radius:8px; background:#eee; flex:none; }
  .side .t { min-width:0; }
  .side .n { font-weight:600; overflow-wrap:anywhere; }
  .side .p { color:var(--muted); font-size:13px; }
  .meta { color:var(--muted); font-size:12px; margin:8px 0; }
  .actions { display:flex; gap:8px; }
  .approve { background:var(--ok); color:#fff; border-color:var(--ok); }
  .reject { background:var(--no); color:#fff; border-color:var(--no); }
  .flag { font-size:11px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  .empty { color:var(--muted); padding:24px 0; }
  @media (max-width:640px){ .pair { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>매칭 검토 (C등급 후보)</h1>
<div class="sub">한·일 상품을 나란히 보고 동일 상품이면 승인(A 확정) / 아니면 거부. <a href="/">통과 목록 ←</a></div>
<div class="bar">
  <input id="token" type="password" placeholder="UI_TOKEN" size="24">
  <button class="primary" onclick="saveTokenAndLoad()">조회</button>
  <span id="count" class="flag"></span>
</div>
<div id="out" class="empty">토큰을 입력하고 조회하세요.</div>
<script>
const $ = (id) => document.getElementById(id);
$('token').value = localStorage.getItem('ui_token') || '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function saveTokenAndLoad(){ localStorage.setItem('ui_token', $('token').value); load(); }

async function load(){
  const token = $('token').value;
  if (!token) return;
  const res = await fetch(`/api/review?token=${encodeURIComponent(token)}`);
  if (!res.ok) { $('out').textContent = `오류: ${res.status}`; return; }
  const { rows } = await res.json();
  $('count').textContent = `검토 대기 ${rows.length}건`;
  if (!rows.length) { $('out').innerHTML = '<div class="empty">검토 대기 없음 🎉</div>'; return; }
  $('out').innerHTML = rows.map(r => `
  <div class="card" id="card-${r.id}">
    <div class="pair">
      <div class="side">
        <img src="${esc(r.kr_image||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="t"><div class="flag">🇰🇷 한국 ${r.kr_code?`· ${esc(r.kr_code)}`:''}</div>
          <div class="n">${esc(r.kr_name)}</div>
          <div class="p">₩${((r.sale_price_krw&&r.sale_price_krw<r.price_krw?r.sale_price_krw:r.price_krw)||0).toLocaleString()} ${r.kr_color?`· ${esc(r.kr_color)}`:''}</div>
          <a href="${esc(r.kr_url)}" target="_blank">상품 보기</a></div>
      </div>
      <div class="side">
        <img src="${esc(r.jp_image||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="t"><div class="flag">🇯🇵 일본 ${r.jp_code?`· ${esc(r.jp_code)}`:''}</div>
          <div class="n">${esc(r.jp_name)}</div>
          <div class="p">¥${(r.price_jpy||0).toLocaleString()} ${r.jp_color?`· ${esc(r.jp_color)}`:''}</div>
          <a href="${esc(r.jp_url)}" target="_blank">상품 보기</a></div>
      </div>
    </div>
    <div class="meta">[${esc(r.brand)}] ${esc(r.note||'')}</div>
    <div class="actions">
      <button class="approve" onclick="decide(${r.id},'approve')">✓ 동일 상품 (승인)</button>
      <button class="reject" onclick="decide(${r.id},'reject')">✗ 다른 상품 (거부)</button>
    </div>
  </div>`).join('');
}

async function decide(id, action){
  const token = $('token').value;
  const res = await fetch(`/api/review/${id}?token=${encodeURIComponent(token)}`, {
    method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({action})
  });
  if (res.ok) { const el = $(`card-${id}`); el.style.opacity = .4; el.querySelectorAll('button').forEach(b=>b.disabled=true); }
  else alert(`오류: ${res.status}`);
}
if ($('token').value) load();
</script>
</body>
</html>

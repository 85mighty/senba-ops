# blog.senbaartstudio.com — 센바 블로그 (WP, 2026-08-27)
server {
    listen 80;
    listen [::]:80;
    server_name blog.senbaartstudio.com;

    root /var/www/blog.senbaartstudio.com;
    set $php_sock /run/php/php8.3-fpm-senba-blog.sock;

    access_log /var/log/nginx/blog.senbaartstudio.com.access.log;
    error_log  /var/log/nginx/blog.senbaartstudio.com.error.log;

    location / { return 301 https://blog.senbaartstudio.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.senbaartstudio.com;

    root /var/www/blog.senbaartstudio.com;
    set $php_sock /run/php/php8.3-fpm-senba-blog.sock;

    access_log /var/log/nginx/blog.senbaartstudio.com.access.log;
    error_log  /var/log/nginx/blog.senbaartstudio.com.error.log;

    ssl_certificate     /etc/letsencrypt/live/blog.senbaartstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.senbaartstudio.com/privkey.pem;
    include snippets/ssl-common.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    include snippets/wordpress-common.conf;
}
